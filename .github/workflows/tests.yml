name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: api

      - uses: actions/checkout@v4
        with:
          repository: solyto/localdocker
          path: localdocker

      - name: Prepare local env
        run: cp .env.example .env
        working-directory: localdocker

      - name: Prepare storage directories
        run: mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
        working-directory: api

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker compose --profile test build test
        working-directory: localdocker

      - name: Install composer dependencies
        run: docker compose --profile test run --rm --user 0 test composer install --no-interaction --prefer-dist --no-progress
        working-directory: localdocker

      - name: Run tests with coverage gate
        run: docker compose --profile test run --rm --user 0 test php artisan test --coverage-clover .phpunit.cache/clover.xml --min=60
        working-directory: localdocker

      - name: Upload clover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clover
          path: api/.phpunit.cache/clover.xml
          if-no-files-found: ignore
